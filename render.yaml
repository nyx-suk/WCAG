services:
  - type: web
    name: wcag-accessibility-auditor
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /app/data/auditor.sqlite
      - key: EVIDENCE_DIR
        value: /app/evidence
