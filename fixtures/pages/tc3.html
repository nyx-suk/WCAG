
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TC3 Contrast Fixture</title>
  <style>
    html,
    body {
      margin: 0;
    }

    body {
      background: #555;
      font-family: Arial, sans-serif;
    }

    .hero {
      position: relative;
      width: 960px;
      height: 540px;
      margin: 32px auto;
      overflow: hidden;
    }

    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #hero-caption {
      position: absolute;
      top: 360px;
      left: 72px;
      margin: 0;
      color: #888;
      font-size: 32px;
      line-height: 1.25;
    }
  </style>
</head>
<body>
  <main class="hero">
    <img src="/assets/tc3-photo.svg" alt="A hazy mountain landscape at sunset">
    <p id="hero-caption">Find your quiet place.</p>
  </main>
</body>
</html>
