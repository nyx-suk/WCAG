      <stop offset="0" stop-color="#8d9eae"/>
      <stop offset="0.62" stop-color="#b9a58e"/>
      <stop offset="1" stop-color="#d0b58f"/>
    </linearGradient>
    <linearGradient id="mountains" x1="0" y1="0" x2="1" y2="1">
